<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitar Chord Trainer - Settings</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3h2l2 3h6l2-3h2" stroke="#5b9cff" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="3" y="7" width="18" height="12" rx="2" stroke="#5b9cff" stroke-width="1.5"/>
            <circle cx="8" cy="13" r="2.5" stroke="#5b9cff" stroke-width="1.5"/>
            <circle cx="16" cy="13" r="2.5" stroke="#5b9cff" stroke-width="1.5"/>
          </svg>
          <h1>Guitar Chord Trainer</h1>
        </div>
        <div>
          <a class="btn btn-ghost" href="game.html">Open Game</a>
        </div>
      </header>

      <section class="card">
        <h2 class="section-title">Configure your exercise</h2>

        <div id="msg" class="hidden"></div>

        <div class="grid">
          <div class="settings-group">
            <div class="section-title">Chord Types</div>
            <div class="fieldset" id="field-chordTypes">
              <label class="badge"><input type="checkbox" name="chordTypes" value="M"> Major (M)</label>
              <label class="badge"><input type="checkbox" name="chordTypes" value="m"> Minor (m)</label>
              <label class="badge"><input type="checkbox" name="chordTypes" value="M7"> Major 7 (M7)</label>
              <label class="badge"><input type="checkbox" name="chordTypes" value="m7"> Minor 7 (m7)</label>
              <label class="badge"><input type="checkbox" name="chordTypes" value="7"> Dominant 7 (7)</label>
            </div>
          </div>

          <div class="settings-group">
            <div class="section-title">Degrees of Scale</div>
            <div class="fieldset" id="field-degrees">
              <label class="badge"><input type="checkbox" name="degrees" value="I"> I</label>
              <label class="badge"><input type="checkbox" name="degrees" value="II"> II</label>
              <label class="badge"><input type="checkbox" name="degrees" value="III"> III</label>
              <label class="badge"><input type="checkbox" name="degrees" value="IV"> IV</label>
              <label class="badge"><input type="checkbox" name="degrees" value="V"> V</label>
              <label class="badge"><input type="checkbox" name="degrees" value="VI"> VI</label>
            </div>
          </div>

          <div class="settings-group third">
            <div class="section-title">Root Note String</div>
            <div class="fieldset" id="field-rootString">
              <label class="badge"><input type="checkbox" name="rootStrings" value="E"> Low E string</label>
              <label class="badge"><input type="checkbox" name="rootStrings" value="A"> A string</label>
            </div>
          </div>

          <div class="settings-group third">
            <div class="section-title">Low E Barre Styles</div>
            <div class="fieldset" id="field-eBarreStyles">
              <label class="badge"><input type="checkbox" name="eBarreStyles" value="Flat"> Flat</label>
              <label class="badge"><input type="checkbox" name="eBarreStyles" value="Overhand"> Overhand</label>
            </div>
          </div>

          <div class="settings-group third">
            <div class="section-title">Number of Questions</div>
            <div class="row">
              <input type="number" id="count" min="1" step="1" />
            </div>
          </div>

          <div class="settings-group half">
            <div class="section-title">Duration Range (seconds)</div>
            <div class="range">
              <span class="muted">From</span>
              <input type="number" id="durFrom" min="1" step="1" />
              <span class="muted">To</span>
              <input type="number" id="durTo" min="1" step="1" />
            </div>
            <div class="muted small">Each chord will randomly last within this range.</div>
          </div>

          <div class="settings-group half">
            <div class="section-title">Diatonic Chords Only</div>
            <label class="badge">
              <input type="checkbox" id="diatonicOnly" /> Diatonic Chords Only
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <div class="footer-actions">
          <button id="startBtn" class="btn btn-primary">Start Exercise</button>
          <button id="saveBtn" class="btn btn-success">Save Defaults</button>
          <button id="resetBtn" class="btn btn-ghost">Reset</button>
          <div class="muted">Tip: You can adjust these again during the game.</div>
        </div>
      </section>
    </div>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
